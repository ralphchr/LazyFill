<!doctype html>
<html lang="en">
  <head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Application preview - Google Forms</title></head>
  <body>
    <div id="root"></div>
    <section style="position:absolute;left:480px;top:24px;width:380px;font:14px/1.5 system-ui;padding:24px;border:1px solid #cbd5c6;border-radius:12px;background:white">
      <h2 style="font-size:24px">Local test form</h2><p>No live responses are sent.</p>
      <form>
        <div role="listitem" data-item-id="name"><div role="heading">Full name *</div><input aria-required="true" name="entry.1"></div>
        <div role="listitem" data-item-id="email"><div role="heading">Email *</div><input type="email" required value="your.real.answer@example.com"></div>
        <div role="listitem" data-item-id="program"><div role="heading">Program *</div><select required><option value="">Choose</option><option value="design">Design</option><option value="engineering">Engineering</option></select></div>
        <div role="listitem" data-item-id="resume"><div role="heading">Resume *</div><input type="file" required></div>
        <div role="listitem" data-item-id="notes"><div role="heading">Anything else?</div><textarea></textarea></div>
        <button type="button" jsname="OCpkoe">Next</button><button type="button" jsname="M2UYVd">Submit</button>
      </form>
    </section>
    <script type="module">
      import { FormEngine } from '/src/content-script/engine.ts'
      import { FormAutomation } from '/src/content-script/automation.ts'
      const data = [null, [null, [
        [1, 'Full name', null, 0, [[11, null, 1]]],
        [2, 'Email', null, 0, [[12, null, 1]]],
        [3, 'Program', null, 3, [[13, [['Design'], ['Engineering']], 1]]],
        [4, 'Resume', 'A PDF when you are ready.', 13, [[14, null, 1]]],
        [5, 'Anything else?', null, 1, [[15, null, 0]]],
        [6, 'Your experience', 'These questions are on the next page.', 8],
        [7, 'Tell us about your work', 'A short summary is fine.', 1, [[17, null, 1]]],
        [8, 'Links to projects', null, 0, [[18, null, 0]]],
        [9, 'Availability', 'Plan your schedule.', 8],
        [10, 'Preferred start date', null, 9, [[20, null, 1]]],
      ]]]
      const script = document.createElement('script')
      script.type = 'application/json'
      script.textContent = `var FB_PUBLIC_LOAD_DATA_ = ${JSON.stringify(data)};`
      document.body.append(script)
      const engine = new FormEngine(document, 'https://docs.google.com/forms/d/e/local-test/viewform', sessionStorage)
      engine.installGuards()
      const automation = new FormAutomation(engine, document, 'https://docs.google.com/forms/d/e/local-test/viewform', sessionStorage)
      const scan = settings => ({ ...engine.scan(settings), automation: automation.status() })
      const form = document.querySelector('section form')
      const next = form.querySelector('[jsname="OCpkoe"]')
      next.addEventListener('click', () => {
        if (!form.checkValidity()) return
        form.innerHTML = '<div role="listitem" data-item-id="experience"><div role="heading">Tell us about your work *</div><textarea required></textarea></div><div role="listitem" data-item-id="birthday"><div role="heading">Birthday *</div><input type="date" required></div><div role="listitem" data-item-id="age"><div role="heading">Age *</div><input type="number" required></div><button type="button" jsname="M2UYVd">Submit</button>'
      })
      const demoUpload = document.createElement('button')
      demoUpload.textContent = 'Simulate completed upload'
      demoUpload.onclick = () => { const file = form.querySelector('input[type="file"]'); if (file) file.disabled = true }
      document.querySelector('section').append(demoUpload)
      globalThis.chrome = {
        tabs: {
          query: async () => [{ id: 1, url: 'https://docs.google.com/forms/d/e/local-test/viewform' }],
          sendMessage: async (_id, message) => {
            let result
            if (message.type === 'START') automation.start(message.settings)
            if (message.type === 'STOP') automation.stop()
            if (message.type === 'FILL') result = await engine.fill(message.settings, message.values)
            if (message.type === 'CLEAR') result = await engine.clear()
            return { ok: true, message: result, scan: scan(message.settings) }
          },
        },
        storage: { local: { get: async () => ({ settings: JSON.parse(localStorage.getItem('formpass-demo-settings') || '{}') }), set: async ({ settings }) => localStorage.setItem('formpass-demo-settings', JSON.stringify(settings)) } },
      }
      await import('/src/main.tsx')
    </script>
  </body>
</html>
